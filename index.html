<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>我们的电话时光</title>
<style>
  :root {
    --bg: #1a0a1e;
    --card: #2a1040;
    --accent: #e91e63;
    --voice: #64b5f6;
    --video: #ff9800;
    --love: #ff4081;
    --period: #ff4757;
    --text: #e0d0e8;
    --muted: #806080;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex; justify-content: center;
    padding: 20px;
    -webkit-tap-highlight-color: transparent;
  }
  .app { width: 100%; max-width: 480px; }

  .header {
    text-align: center; padding: 20px 0;
    background: linear-gradient(135deg, #1a0a1e 0%, #2a1040 50%, #1a0a1e 100%);
    border-radius: 16px; margin-bottom: 16px;
  }
  .header h1 { font-size: 22px; margin-bottom: 10px; }
  .stats { display: flex; justify-content: center; gap: 20px; font-size: 13px; color: var(--muted); }
  .stats strong { color: var(--accent); font-size: 16px; display: block; }
  .love-meter { margin-top: 10px; font-size: 20px; }
  .love-score { font-size: 13px; color: var(--muted); }

  .month-nav {
    display: flex; align-items: center; justify-content: center;
    gap: 16px; margin-bottom: 12px; font-size: 16px; font-weight: 600;
  }
  .month-nav button {
    background: var(--card); border: none; color: var(--text);
    width: 36px; height: 36px; border-radius: 50%; cursor: pointer;
    font-size: 16px; transition: background 0.2s;
  }
  .month-nav button:hover { background: #3a1a50; }
  .today-btn {
    background: var(--accent); border: none; color: #fff;
    padding: 6px 14px; border-radius: 12px; cursor: pointer;
    font-size: 12px; font-weight: 500;
  }

  .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .day {
    aspect-ratio: 1; border-radius: 10px; background: var(--card);
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; cursor: pointer; font-size: 13px;
    transition: all 0.2s; position: relative; overflow: hidden;
  }
  .day:hover { background: #3a1a58; }
  .day.selected { box-shadow: 0 0 0 2px var(--accent); }
  .day.today { border: 1px solid var(--accent); }
  .day.empty { background: transparent; cursor: default; }
  .day .date { font-weight: 600; position: relative; z-index: 1; }
  .day .duration { font-size: 10px; color: var(--muted); margin-top: 1px; position: relative; z-index: 1; }
  .day .hearts { font-size: 11px; line-height: 1; position: relative; z-index: 1; }
  .day .keywords { font-size: 9px; color: #b090c0; margin-top: 1px; position: relative; z-index: 1; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 2px; }
  .day.has-call { background: #2a1450; }
  .day.period { box-shadow: inset 0 0 0 2px var(--period); }
  .day .period-dot {
    position: absolute; top: 3px; right: 3px; width: 8px; height: 8px;
    border-radius: 50%; background: var(--period); z-index: 2;
  }

  .edit-panel {
    background: var(--card); border-radius: 16px; padding: 20px 16px;
    margin-top: 16px; text-align: center;
  }
  .edit-panel h3 { font-size: 14px; color: var(--muted); margin-bottom: 12px; }
  .edit-section { margin-bottom: 14px; }

  .type-toggle { display: flex; gap: 8px; justify-content: center; }
  .type-btn {
    flex: 1; max-width: 140px; padding: 10px; border-radius: 12px;
    border: 2px solid transparent; cursor: pointer; font-size: 14px;
    font-weight: 600; background: #1a0a2a; color: var(--muted);
    transition: all 0.2s;
  }
  .type-btn.voice.active { border-color: var(--voice); color: var(--voice); background: #0d1a2a; }
  .type-btn.video.active { border-color: var(--video); color: var(--video); background: #2a1a0d; }
  .type-btn .icon { font-size: 22px; display: block; margin-bottom: 4px; }

  /* Scroll wheel time picker */
  .time-picker { margin-bottom: 6px; }
  .time-tabs { display: flex; gap: 6px; justify-content: center; margin-bottom: 12px; }
  .time-tab {
    padding: 6px 20px; border-radius: 14px; border: 1px solid #4a2060;
    background: transparent; color: var(--muted); cursor: pointer;
    font-size: 13px; font-weight: 500; transition: all 0.2s;
  }
  .time-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .wheels-row { display: flex; gap: 16px; justify-content: center; align-items: flex-start; margin-bottom: 8px; }
  .wheel-col { display: flex; flex-direction: column; align-items: center; }
  .wheel-col-label { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .wheel {
    width: 72px; height: 160px; overflow-y: auto;
    scroll-snap-type: y mandatory;
    -webkit-overflow-scrolling: touch;
    position: relative; border-radius: 10px;
    background: #12061a;
  }
  .wheel::-webkit-scrollbar { display: none; }
  .wheel-inner { padding: 60px 0; }
  .wheel-item {
    height: 40px; display: flex; align-items: center; justify-content: center;
    font-size: 17px; color: #604070; scroll-snap-align: center;
    transition: color 0.15s, font-size 0.15s; user-select: none;
    font-variant-numeric: tabular-nums;
  }
  .wheel-item.active { color: #fff; font-size: 22px; font-weight: 700; }

  .wheel-highlight {
    position: absolute; top: 50%; left: 4px; right: 4px; height: 40px;
    transform: translateY(-50%); border-top: 1px solid #4a2060;
    border-bottom: 1px solid #4a2060; pointer-events: none;
    border-radius: 4px;
  }

  .duration-display { font-size: 14px; color: var(--accent); font-weight: 600; margin-bottom: 4px; }

  .keyword-input {
    width: 100%; background: #1a0a2a; color: #fff; border: 1px solid #4a2060;
    padding: 10px 14px; border-radius: 10px; font-size: 14px; font-family: inherit;
    text-align: center; outline: none;
  }
  .keyword-input:focus { border-color: var(--accent); }
  .keyword-input::placeholder { color: #604070; }

  .period-row { display: flex; align-items: center; justify-content: center; gap: 10px; }
  .period-row label { font-size: 13px; color: var(--muted); cursor: pointer; }
  .period-toggle {
    width: 48px; height: 28px; border-radius: 14px; border: none;
    background: #3a2050; cursor: pointer; position: relative;
    transition: background 0.2s;
  }
  .period-toggle::after {
    content: ''; position: absolute; top: 3px; left: 3px;
    width: 22px; height: 22px; border-radius: 50%; background: #806080;
    transition: all 0.2s;
  }
  .period-toggle.active { background: var(--period); }
  .period-toggle.active::after { left: 23px; background: #fff; }

  .actions { display: flex; gap: 8px; justify-content: center; }
  .btn {
    padding: 10px 28px; border-radius: 20px; border: none; cursor: pointer;
    font-size: 14px; font-weight: 600; transition: all 0.2s;
  }
  .btn-save { background: var(--accent); color: #fff; }
  .btn-save:hover { filter: brightness(1.2); }
  .btn-delete { background: transparent; color: #e57373; border: 1px solid #e57373; }
  .btn-delete:hover { background: #e5737320; }
  .btn-delete:disabled { opacity: 0.3; cursor: not-allowed; }

  .cycle-hint { font-size: 11px; color: var(--muted); margin-top: 6px; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>💕 我们的电话时光</h1>
    <div class="stats">
      <div>通话天数<br><strong id="stat-days">0</strong></div>
      <div>总时长<br><strong id="stat-hours">0h</strong></div>
      <div>视频次数<br><strong id="stat-video">0</strong></div>
    </div>
    <div class="love-meter" id="love-meter">💔</div>
    <div class="love-score" id="love-score">本月爱情度：0 点</div>
  </div>

  <div class="month-nav">
    <button id="prev-month">◀</button>
    <span id="month-label">2026年5月</span>
    <button id="next-month">▶</button>
    <button class="today-btn" id="today-btn">今天</button>
  </div>

  <div class="weekdays">
    <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
  </div>
  <div class="calendar" id="calendar"></div>

  <div class="edit-panel" id="edit-panel">
    <h3 id="edit-title">选择日期记录通话</h3>

    <div class="edit-section type-toggle">
      <button class="type-btn voice active" data-type="voice">
        <span class="icon">📞</span>语音
      </button>
      <button class="type-btn video" data-type="video">
        <span class="icon">📹</span>视频
      </button>
    </div>

    <div class="edit-section time-picker">
      <div class="time-tabs">
        <button class="time-tab active" data-tab="start">开始时间</button>
        <button class="time-tab" data-tab="end">结束时间</button>
      </div>
      <div class="wheels-row" id="wheels-row">
        <div class="wheel-col">
          <div class="wheel-col-label">时</div>
          <div class="wheel" id="wh" style="position:relative">
            <div class="wheel-highlight"></div>
            <div class="wheel-inner" id="wh-inner"></div>
          </div>
        </div>
        <div class="wheel-col">
          <div class="wheel-col-label">分</div>
          <div class="wheel" id="wm" style="position:relative">
            <div class="wheel-highlight"></div>
            <div class="wheel-inner" id="wm-inner"></div>
          </div>
        </div>
      </div>
      <div class="duration-display" id="duration-display">时长：0h 0min</div>
    </div>

    <div class="edit-section">
      <input type="text" class="keyword-input" id="keywords" placeholder="今日关键词，用逗号分隔（如：约会,看电影）">
    </div>

    <div class="edit-section period-row">
      <button class="period-toggle" id="period-toggle"></button>
      <label for="period-toggle">经期日</label>
    </div>

    <div class="edit-section actions">
      <button class="btn btn-save" id="btn-save">保存</button>
      <button class="btn btn-delete" id="btn-delete" disabled>清空</button>
    </div>

    <div class="cycle-hint" id="cycle-hint"></div>
  </div>
</div>

<script>
const STORAGE_KEY = 'call-records';
const ITEM_H = 40;
let currentYear, currentMonth, selectedDay, selectedType;
let records = {};
let periodActive = false;
let activeTimeTab = 'start';
// current wheel values
let startH = 0, startM = 0, endH = 0, endM = 0;
let wheelScrollTimers = { wh: null, wm: null };
let wheelChanging = false;

// ---- data layer ----
function loadRecords() {
  try { records = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
  catch { records = {}; }
}
function saveRecords() { localStorage.setItem(STORAGE_KEY, JSON.stringify(records)); }

function monthKey(y, m) { return `${y}-${String(m + 1).padStart(2, '0')}`; }
function dayData(y, m, d) {
  const key = monthKey(y, m);
  return (records[key] && records[key][String(d)]) || null;
}
function setDayData(y, m, d, data) {
  const key = monthKey(y, m);
  if (!records[key]) records[key] = {};
  if (data === null) delete records[key][String(d)];
  else records[key][String(d)] = data;
  saveRecords();
}

function lovePoints(data) {
  if (!data) return 0;
  const totalMin = (data.hours || 0) * 60 + (data.minutes || 0);
  return Math.round(totalMin * (data.type === 'video' ? 1.5 : 1));
}

function loveHearts(points) {
  if (points >= 120) return '💖💖💖💖💖';
  if (points >= 80) return '💖💖💖💖';
  if (points >= 40) return '💖💖💖';
  if (points >= 10) return '💖💖';
  if (points >= 1) return '💖';
  return '💔';
}

function formatDuration(h, m) {
  h = h || 0; m = m || 0;
  if (h === 0 && m === 0) return '';
  if (h === 0) return `${m}分`;
  if (m === 0) return `${h}h`;
  return `${h}h${m}分`;
}

function getPeriodDays(y, m) {
  const key = monthKey(y, m);
  const monthData = records[key] || {};
  const days = [];
  for (const [day, data] of Object.entries(monthData)) {
    if (data.period) days.push(parseInt(day));
  }
  days.sort((a, b) => a - b);
  return days;
}

function getRecentPeriodStart() {
  let y = currentYear, m = currentMonth;
  for (let i = 0; i < 6; i++) {
    const days = getPeriodDays(y, m);
    if (days.length > 0) return { year: y, month: m, day: days[0] };
    m--; if (m < 0) { m = 11; y--; }
  }
  return null;
}

function calcMonthStats(y, m) {
  const key = monthKey(y, m);
  const monthData = records[key] || {};
  let totalMin = 0, days = 0, videoCount = 0, totalPoints = 0, periodCount = 0;
  for (const [day, data] of Object.entries(monthData)) {
    const min = (data.hours || 0) * 60 + (data.minutes || 0);
    if (min > 0) { days++; totalMin += min; totalPoints += lovePoints(data); }
    if (data.type === 'video') videoCount++;
    if (data.period) periodCount++;
  }
  return { days, totalHours: (totalMin / 60).toFixed(1), videoCount, totalPoints, periodCount };
}

// ---- wheel picker ----
function buildWheelItems(inner, count, padZero) {
  inner.innerHTML = '';
  for (let i = 0; i < count; i++) {
    const div = document.createElement('div');
    div.className = 'wheel-item';
    div.textContent = padZero ? String(i).padStart(2, '0') : i;
    div.dataset.value = i;
    inner.appendChild(div);
  }
}

function scrollWheelTo(wheelId, value) {
  const wheel = document.getElementById(wheelId);
  wheel.scrollTop = value * ITEM_H;
  updateWheelActive(wheelId);
}

function updateWheelActive(wheelId) {
  const wheel = document.getElementById(wheelId);
  const idx = Math.round(wheel.scrollTop / ITEM_H);
  const items = wheel.querySelectorAll('.wheel-item');
  items.forEach((item, i) => {
    item.classList.toggle('active', i === idx);
  });
}

function getWheelValue(wheelId) {
  const wheel = document.getElementById(wheelId);
  return Math.round(wheel.scrollTop / ITEM_H);
}

function onWheelScroll(wheelId) {
  // Debounce: update active class during scroll, fire calculation on stop
  updateWheelActive(wheelId);
  clearTimeout(wheelScrollTimers[wheelId]);
  wheelScrollTimers[wheelId] = setTimeout(() => {
    // Snap to nearest item
    const wheel = document.getElementById(wheelId);
    const idx = Math.round(wheel.scrollTop / ITEM_H);
    wheel.scrollTo({ top: idx * ITEM_H, behavior: 'smooth' });
    updateWheelState();
  }, 150);
}

function updateWheelState() {
  if (wheelChanging) return;
  startH = getWheelValue('wh');
  startM = getWheelValue('wm');
  if (activeTimeTab === 'end') {
    endH = startH; endM = startM;
    // restore start values
    startH = getWheelValue('wh'); // will be overwritten below
  }
  // Re-read both
  const h = getWheelValue('wh');
  const m = getWheelValue('wm');
  if (activeTimeTab === 'start') { startH = h; startM = m; }
  else { endH = h; endM = m; }

  updateDurationDisplay();
}

function updateDurationDisplay() {
  let startMin = startH * 60 + startM;
  let endMin = endH * 60 + endM;
  if (endMin <= startMin) endMin += 24 * 60;
  const diff = endMin - startMin;
  const dh = Math.floor(diff / 60);
  const dm = diff % 60;
  const durStr = dh === 0 && dm === 0 ? '0min' : formatDuration(dh, dm);
  document.getElementById('duration-display').textContent = `时长：${durStr}`;
}

function switchTimeTab(tab) {
  activeTimeTab = tab;
  document.querySelectorAll('.time-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  wheelChanging = true;
  if (tab === 'start') {
    scrollWheelTo('wh', startH);
    scrollWheelTo('wm', startM);
  } else {
    scrollWheelTo('wh', endH);
    scrollWheelTo('wm', endM);
  }
  wheelChanging = false;
}

function setWheelValues(sh, sm, eh, em) {
  startH = sh; startM = sm; endH = eh; endM = em;
  wheelChanging = true;
  if (activeTimeTab === 'start') {
    scrollWheelTo('wh', sh);
    scrollWheelTo('wm', sm);
  } else {
    scrollWheelTo('wh', eh);
    scrollWheelTo('wm', em);
  }
  wheelChanging = false;
  updateDurationDisplay();
}

// ---- calendar ----
function renderCalendar(y, m) {
  const grid = document.getElementById('calendar');
  const today = new Date();
  const firstDay = new Date(y, m, 1).getDay();
  const daysInMonth = new Date(y, m + 1, 0).getDate();

  grid.innerHTML = '';
  for (let i = 0; i < firstDay; i++) grid.appendChild(createDayEl(null));
  for (let d = 1; d <= daysInMonth; d++) {
    const data = dayData(y, m, d);
    const isToday = y === today.getFullYear() && m === today.getMonth() && d === today.getDate();
    grid.appendChild(createDayEl(d, data, isToday));
  }
  document.getElementById('month-label').textContent = `${y}年${m + 1}月`;
  updateStats(y, m);
  updateEditPanel();
}

function createDayEl(day, data, isToday) {
  const div = document.createElement('div');
  if (day === null) { div.className = 'day empty'; return div; }
  let cls = 'day';
  if (isToday) cls += ' today';
  if (data) {
    if ((data.hours || 0) * 60 + (data.minutes || 0) > 0) cls += ' has-call';
    if (data.period) cls += ' period';
  }
  div.className = cls;
  let html = `<div class="date">${day}</div>`;
  if (data) {
    const dur = formatDuration(data.hours, data.minutes);
    if (dur) {
      html += `<div class="duration">${data.type === 'video' ? '📹' : '📞'} ${dur}</div>`;
      html += `<div class="hearts">${loveHearts(lovePoints(data))}</div>`;
    }
    if (data.keywords) {
      const kw = data.keywords.split(/[,，\s]+/).filter(Boolean).slice(0, 2).join('·');
      html += `<div class="keywords">${kw}</div>`;
    }
    if (data.period) html += `<div class="period-dot"></div>`;
  }
  div.innerHTML = html;
  if (day === selectedDay && currentYear === selectedDay?.year && currentMonth === selectedDay?.month) {
    div.classList.add('selected');
  }
  div.addEventListener('click', () => selectDay(day));
  return div;
}

function selectDay(day) {
  selectedDay = { year: currentYear, month: currentMonth, day };
  const data = dayData(currentYear, currentMonth, day);
  selectedType = data && data.type ? data.type : 'voice';
  periodActive = !!(data && data.period);

  document.querySelectorAll('.day').forEach(d => d.classList.remove('selected'));
  document.querySelectorAll('.day:not(.empty)').forEach(d => {
    if (parseInt(d.querySelector('.date')?.textContent) === day) d.classList.add('selected');
  });
  updateEditPanel();
}

function updateEditPanel() {
  const title = document.getElementById('edit-title');
  const btnDelete = document.getElementById('btn-delete');
  const keywordsInput = document.getElementById('keywords');
  const periodToggle = document.getElementById('period-toggle');
  const typeBtns = document.querySelectorAll('.type-btn');

  if (!selectedDay) {
    title.textContent = '选择日期记录通话';
    btnDelete.disabled = true;
    keywordsInput.value = '';
    periodToggle.classList.remove('active');
    document.getElementById('cycle-hint').textContent = '';
    return;
  }

  const data = dayData(selectedDay.year, selectedDay.month, selectedDay.day);
  title.textContent = `${selectedDay.month + 1}月${selectedDay.day}日`;
  btnDelete.disabled = !data;

  // Set wheel values
  const sh = data && data.startTime ? parseInt(data.startTime.split(':')[0]) : 0;
  const sm = data && data.startTime ? parseInt(data.startTime.split(':')[1]) : 0;
  const eh = data && data.endTime ? parseInt(data.endTime.split(':')[0]) : 0;
  const em = data && data.endTime ? parseInt(data.endTime.split(':')[1]) : 0;
  setWheelValues(sh, sm, eh, em);

  keywordsInput.value = data ? (data.keywords || '') : '';
  periodActive = !!(data && data.period);
  periodToggle.classList.toggle('active', periodActive);

  typeBtns.forEach(b => b.classList.toggle('active', b.dataset.type === selectedType));
  calcCycleHint();
}

function updateStats(y, m) {
  const stats = calcMonthStats(y, m);
  document.getElementById('stat-days').textContent = stats.days;
  document.getElementById('stat-hours').textContent = stats.totalHours + 'h';
  document.getElementById('stat-video').textContent = stats.videoCount;
  const pts = stats.totalPoints;
  document.getElementById('love-meter').textContent = loveHearts(pts);
  document.getElementById('love-score').textContent = stats.periodCount > 0
    ? `本月爱情度：${pts} 点 · 🩸${stats.periodCount}天`
    : `本月爱情度：${pts} 点`;
}

function calcCycleHint() {
  const hintEl = document.getElementById('cycle-hint');
  if (!selectedDay) { hintEl.textContent = ''; return; }

  const data = dayData(selectedDay.year, selectedDay.month, selectedDay.day);
  const isPeriod = !!(data && data.period);

  if (!isPeriod && !periodActive) {
    const recent = getRecentPeriodStart();
    if (recent) {
      const recentDate = new Date(recent.year, recent.month, recent.day);
      const selDate = new Date(selectedDay.year, selectedDay.month, selectedDay.day);
      const diffDays = Math.round((selDate - recentDate) / (1000 * 60 * 60 * 24));
      if (diffDays >= 0 && diffDays <= 35) {
        hintEl.textContent = `距上次经期第 ${diffDays + 1} 天`;
        return;
      }
    }
    hintEl.textContent = '';
  } else if (periodActive) {
    const periodDays = getPeriodDays(selectedDay.year, selectedDay.month);
    const allDays = [...new Set([...periodDays, selectedDay.day])].sort((a, b) => a - b);
    const idx = allDays.indexOf(selectedDay.day);
    let streakStart = idx, streakEnd = idx;
    while (streakStart > 0 && allDays[streakStart - 1] === allDays[streakStart] - 1) streakStart--;
    while (streakEnd < allDays.length - 1 && allDays[streakEnd + 1] === allDays[streakEnd] + 1) streakEnd++;
    const streakLen = streakEnd - streakStart + 1;
    const dayInStreak = idx - streakStart + 1;
    hintEl.textContent = streakLen === 1 ? '经期第 1 天' : `经期第 ${dayInStreak} 天（共 ${streakLen} 天）`;
  } else {
    hintEl.textContent = '';
  }
}

function saveEntry() {
  if (!selectedDay) return;
  const h = (activeTimeTab === 'start' ? endH : startH);
  // Calculate actual duration from start/end
  let sm = startH * 60 + startM;
  let em = endH * 60 + endM;
  if (em <= sm) em += 24 * 60;
  const diff = em - sm;
  const hours = Math.floor(diff / 60);
  const minutes = diff % 60;

  const startTime = `${String(startH).padStart(2, '0')}:${String(startM).padStart(2, '0')}`;
  const endTime = `${String(endH).padStart(2, '0')}:${String(endM).padStart(2, '0')}`;
  const keywords = document.getElementById('keywords').value.trim();
  const period = periodActive;

  if (hours === 0 && minutes === 0 && !keywords && !period) {
    setDayData(selectedDay.year, selectedDay.month, selectedDay.day, null);
  } else {
    setDayData(selectedDay.year, selectedDay.month, selectedDay.day, {
      type: selectedType, hours, minutes, startTime, endTime, keywords, period
    });
  }
  renderCalendar(currentYear, currentMonth);
  selectDay(selectedDay.day);
}

function deleteEntry() {
  if (!selectedDay) return;
  setDayData(selectedDay.year, selectedDay.month, selectedDay.day, null);
  renderCalendar(currentYear, currentMonth);
  selectDay(selectedDay.day);
}

// ---- init ----
loadRecords();
const now = new Date();
currentYear = now.getFullYear();
currentMonth = now.getMonth();

// Build wheel items
buildWheelItems(document.getElementById('wh-inner'), 24, false);
buildWheelItems(document.getElementById('wm-inner'), 60, true);

// Wheel scroll listeners
['wh', 'wm'].forEach(id => {
  document.getElementById(id).addEventListener('scroll', () => onWheelScroll(id), { passive: true });
});

// Time tab switching
document.querySelectorAll('.time-tab').forEach(tab => {
  tab.addEventListener('click', () => switchTimeTab(tab.dataset.tab));
});

// Call type buttons
document.querySelectorAll('.type-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    selectedType = btn.dataset.type;
    document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });
});

document.getElementById('period-toggle').addEventListener('click', () => {
  periodActive = !periodActive;
  document.getElementById('period-toggle').classList.toggle('active', periodActive);
  calcCycleHint();
});

document.getElementById('btn-save').addEventListener('click', saveEntry);
document.getElementById('btn-delete').addEventListener('click', deleteEntry);

document.getElementById('prev-month').addEventListener('click', () => {
  currentMonth--; if (currentMonth < 0) { currentMonth = 11; currentYear--; }
  selectedDay = null;
  renderCalendar(currentYear, currentMonth);
});

document.getElementById('next-month').addEventListener('click', () => {
  currentMonth++; if (currentMonth > 11) { currentMonth = 0; currentYear++; }
  selectedDay = null;
  renderCalendar(currentYear, currentMonth);
});

document.getElementById('today-btn').addEventListener('click', () => {
  currentYear = now.getFullYear();
  currentMonth = now.getMonth();
  selectedDay = null;
  renderCalendar(currentYear, currentMonth);
});

document.addEventListener('keydown', e => {
  if (e.code === 'ArrowLeft' && e.ctrlKey) document.getElementById('prev-month').click();
  if (e.code === 'ArrowRight' && e.ctrlKey) document.getElementById('next-month').click();
});

renderCalendar(currentYear, currentMonth);
</script>
</body>
</html>
